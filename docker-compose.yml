services:
  web:
    build: .
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    restart: unless-stopped
  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://superahorro:superahorro_local@db:5432/superahorro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superahorro
      POSTGRES_USER: superahorro
      POSTGRES_PASSWORD: superahorro_local
    volumes: ["superahorro_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U superahorro -d superahorro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  superahorro_data: